name: CI

# Verify-only pipeline: compiles, lints, and unit-tests every module on
# every push/PR. Never assembles or uploads a release build — there is
# no signing config in this repo and there shouldn't be one here (see
# docs/HANDOVER.md "Non-negotiable rules": signing/release files are
# R-phase-and-later scope). This workflow exists purely so CI is the
# single source of truth for "does it build" — no manual builds.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

# Cancel a stale run on the same branch/PR the moment a newer push lands,
# so we're never burning cache/compute re-verifying commits nobody cares
# about anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gradle verify (debug only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Handles Gradle Wrapper caching, dependency caching, AND the local
      # build-cache directory (~/.gradle/caches/build-cache-1) across runs.
      # Combined with org.gradle.caching=true in gradle.properties, tasks
      # whose inputs haven't changed since the last successful run come
      # back FROM-CACHE/UP-TO-DATE instead of re-executing — a module that
      # already passed doesn't get re-run (and can't newly fail) just
      # because an unrelated module changed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # Build number/name: <app name>-<major>.<minor>.<CI run number>.
      # run_number increments every workflow run on this repo, so it's a
      # stable, monotonically increasing build identifier without needing
      # to touch/tag anything by hand.
      - name: Compute build version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=TRADE-0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # `check` = compile + unit tests + lint for every module, debug
      # variant only. Deliberately not `assemble`/`bundle`/`assembleRelease`
      # — this pipeline verifies the build, it doesn't produce or publish
      # an installable artifact.
      - name: Gradle check (compile + unit tests + lint)
        run: |
          ./gradlew check \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            --build-cache

      - name: Build summary
        if: always()
        run: |
          echo "### TRADE CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: \`${{ steps.version.outputs.name }}\` (code ${{ steps.version.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "No release artifact is produced by this workflow." >> "$GITHUB_STEP_SUMMARY"
