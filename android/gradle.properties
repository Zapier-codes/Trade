org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Aggressive caching for CI (.github/workflows/ci.yml) and local builds:
# task outputs get cached and reused across runs instead of re-running
# work that already passed. See HANDOVER.md Known Issues for the CI note.
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache speeds up repeat invocations further. If a future
# AGP/plugin version proves incompatible, disable this line rather than
# fighting it — don't let CI setup block a slice over this.
org.gradle.configuration-cache=true

